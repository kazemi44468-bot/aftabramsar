name: Collect Ramsar photos
on:
  push:
    paths:
      - ".github/workflows/collect-ramsar-photos.yml"
      - "scripts/collect_ramsar_photos.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ramsar-photo-collection
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Move existing images into assets/images
        run: |
          mkdir -p assets/images
          if [ -d images ]; then
            find images -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name 'sources.json' \) -exec mv -f {} assets/images/ \;
            rm -f images/.gitkeep
            rmdir images 2>/dev/null || true
          fi
      - name: Download licensed photos from Wikimedia Commons
        run: python scripts/collect_ramsar_photos.py
      - name: Commit moved photos and license manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Move Ramsar photos to assets and refresh photo manifest"
            git push
          else
            echo "No photo changes."
          fi

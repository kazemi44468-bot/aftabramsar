name: Download Ostadid Wardavard images
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/download_wardavard_images.py
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download project images
        run: python scripts/download_wardavard_images.py
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ostadid-wardavard/assets/images/
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Download local Ostadid Wardavard project images"
            git push
          fi
